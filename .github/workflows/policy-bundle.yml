# Policy-bundle pipeline (spec Ch. 20, R2, R8): the structural validator is a REQUIRED stage;
# signing only runs after it passes, and OPA rejects unsigned bundles at load (Ch. 21).
name: policy-bundle
on:
  push:
    branches: [main]
    paths: ["policies/**", "keystone/authz/policy_verify/**", "tests/policy/hostile_seeds.json", ".github/workflows/policy-bundle.yml"]
  pull_request:
    paths: ["policies/**", "keystone/authz/policy_verify/**", "tests/policy/hostile_seeds.json", ".github/workflows/policy-bundle.yml"]

permissions:
  contents: read
  id-token: write  # Cosign keyless signing

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - uses: astral-sh/setup-uv@v5
      - run: uv python install
      - run: uv sync --locked
      - run: opa fmt --fail --list policies
      - run: opa check --strict policies
      - run: opa test --coverage --threshold 100 policies
      - name: keystone-policy-verify (required, non-skippable)
        run: uv run keystone-policy-verify policies
      # R2: validator pass AND hostile-matrix pass are both required before signing.
      - name: Hostile matrix (required, non-skippable)
        run: uv run python -m keystone.authz.policy_verify.hostile policies --seeds tests/policy/hostile_seeds.json

  build-and-sign:
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: latest
      - uses: sigstore/cosign-installer@v3
      - uses: astral-sh/setup-uv@v5
      - run: uv python install
      - run: uv sync --locked --no-dev
      # R8: revision = content digest of the sources, bundle_sequence = this CI counter (never
      # author- or admin-supplied), OPA-signed with the key whose public half OPA trusts. The
      # build inspects the result exactly as POST /v1/policy/pins will. The key reaches the
      # step through `env`, never interpolated into the script.
      - name: Build and OPA-sign the bundle
        env:
          OPA_BUNDLE_SIGNING_KEY: ${{ secrets.OPA_BUNDLE_SIGNING_KEY }}
        run: |
          umask 077
          key="$RUNNER_TEMP/opa-signing.pem"
          printf '%s\n' "$OPA_BUNDLE_SIGNING_KEY" > "$key"
          uv run python -m keystone.authz.build_bundle --policies policies \
            --sequence "$GITHUB_RUN_NUMBER" --signing-key "$key" \
            --out keystone-policy-bundle.tar.gz
          rm -f "$key"
      - run: sha256sum keystone-policy-bundle.tar.gz | tee keystone-policy-bundle.sha256
      - name: Cosign keyless sign (only reachable after validate succeeded)
        run: cosign sign-blob --yes --bundle keystone-policy-bundle.cosign keystone-policy-bundle.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: keystone-policy-bundle-${{ github.run_number }}
          path: |
            keystone-policy-bundle.tar.gz
            keystone-policy-bundle.sha256
            keystone-policy-bundle.cosign
