services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: keystone_admin
      POSTGRES_PASSWORD: keystone_test
      POSTGRES_DB: keystone_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keystone_admin -d keystone_test"]
      interval: 2s
      timeout: 2s
      retries: 30
